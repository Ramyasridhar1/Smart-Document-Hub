<!-- templates/login.html -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Sign In - Smart Document Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, #eaf0f6 0%, #dde7f1 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border: 1px solid #d5e0ec;
      border-radius: 14px;
      box-shadow: 0 12px 28px rgba(24, 39, 75, 0.12);
      padding: 28px;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <h3 class="mb-2">Smart Document Hub</h3>
    <p class="text-muted mb-4">Sign in to continue</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat, msg in messages %}
          <div class="alert {% if cat == 'error' %}alert-danger{% elif cat == 'success' %}alert-success{% else %}alert-info{% endif %}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post" action="{{ url_for('login', next=next) }}">
      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <input class="form-control" name="username" required value="{{ request.form.username or '' }}" />
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Password</label>
        <input class="form-control" name="password" type="password" required />
      </div>
      <button type="submit" class="btn btn-primary w-100">Sign in</button>
    </form>

    <p class="mt-3 mb-0 small text-muted">Contact your administrator if you need an account.</p>
  </div>
</body>
</html>
